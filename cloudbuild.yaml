steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'gcr.io/$PROJECT_ID/ai-analyst-for-startup-evaluation:$COMMIT_SHA', '.' ]

  # Step 2: Run tests (if you have a test script; adapt as needed)
  - name: 'python'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -z "$(ls tests 2>/dev/null)" ]; then echo "No tests directory."; else pytest tests; fi

  # Step 3: Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'gcr.io/$PROJECT_ID/ai-analyst-for-startup-evaluation:$COMMIT_SHA' ]

  # Step 4: Deploy to Cloud Run (optional; edit service name/region as needed)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-analyst-for-startup-evaluation'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ai-analyst-for-startup-evaluation:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/ai-analyst-for-startup-evaluation:$COMMIT_SHA'
